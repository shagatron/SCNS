[project]
name = "scns-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.17,<1",
  "argon2-cffi>=25,<26",
  "pillow>=12,<13",
  "pypdfium2>=5,<6",
  "segno>=1.6,<2",
  "shapely>=2.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pypdf>=6,<7",
    "zxing-cpp>=2.3,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short" # Keep ephemeral credentials out of fixture-value tracebacks.
pythonpath = ["."]
markers = ["integration: requires an isolated real PostGIS database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
