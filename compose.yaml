name: scns
services:
  db:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_USER: scns
      POSTGRES_PASSWORD: scns_local
      POSTGRES_DB: scns
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scns -d scns"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    image: scns-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://scns:scns_local@db:5432/scns
      DEMO_ENABLED: "true"
      APP_ENV: development
      STORAGE_ROOT: /app/storage
    volumes: ["private-imports:/app/storage"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
  import-worker:
    image: scns-api
    command: ["python", "-m", "app.cli.imports", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://scns:scns_local@db:5432/scns
      STORAGE_ROOT: /app/storage
      APP_ENV: development
    volumes: ["private-imports:/app/storage"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  private-imports:
